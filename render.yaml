services:
  # ── Frontend (Static Site) ───────────────────────────────────────
  - type: web
    name: cleancity-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    # Rewrite ALL routes to index.html so React Router handles them
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cleancity-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://cleancity-backend.onrender.com

  # ── Backend (Web Service) ────────────────────────────────────────
  - type: web
    name: cleancity-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://cleancity-frontend.onrender.com
